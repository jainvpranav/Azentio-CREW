<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Credit Analyst — Bank Statement Review{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>
                <span class="brand-icon">BSA</span>
                Credit Analyst — Bank Statement Review
            </h1>
            <nav class="nav">
                <a href="/"            class="{% if page == 'home' %}active{% endif %}">Upload</a>
                <a href="/transactions" class="{% if page == 'transactions' %}active{% endif %}">Transactions</a>
                <a href="/analysis"    class="{% if page == 'analysis' %}active{% endif %}">Analysis</a>
                <a href="/review"      class="{% if page == 'review' %}active{% endif %}">Review Queue</a>
                <a href="/assessment"  class="{% if page == 'assessment' %}active{% endif %}">Assessment</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer style="text-align:center; padding:20px; color:var(--gray-400); border-top:1px solid var(--border); margin-top:40px; font-size:12px;">
        Bank Statement Analyzer v0.1.0 &mdash; Data stays local &mdash; For internal analyst use only
    </footer>
</body>
</html>
